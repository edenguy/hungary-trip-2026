<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>כיתובים לאלבום</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#1d1b19;--mut:#6b655e;--line:#e6e1d9;--acc:#8a2f3b}
@media (prefers-color-scheme:dark){:root{--bg:#151413;--card:#201e1c;--ink:#f2eee8;--mut:#a39c92;--line:#332f2b;--acc:#e08a96}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Heebo",sans-serif;padding:0 16px 40px}
header{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);z-index:2}
h1{font-size:20px;margin:0 0 4px}p{margin:0;color:var(--mut);font-size:14px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:12px 0}.imgs{display:flex;gap:6px;margin-bottom:8px}.imgs img{width:calc(33.3% - 4px);aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--line)}.grp h2{font-size:17px;margin:2px 0 4px}.grp p{color:var(--ink);font-size:15px;margin:0 0 10px}.grp button{width:100%}
.row img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none;background:var(--line)}
.t{color:var(--mut);font-size:12px;direction:ltr;text-align:right}
.c{flex:1;min-width:0}.c b{display:block;font-weight:600}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--acc);border-radius:999px;padding:6px 12px;cursor:pointer;flex:none}
button.done{color:var(--mut)}
.top{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<header>
<h1>כיתובים לאלבום Google Photos</h1>
<p>כיתוב אחד לכל נושא, עם עובדה על המקום. מספרי התמונות לפי הסדר באלבום (מהישן לחדש). הדביקו את הכיתוב בתמונה הראשונה של הנושא, או בכל התמונות.</p>
<div class="top"><button id="all">העתק הכל</button></div>
</header>
<main id="list"></main>
<script src="mapdata.js"></script>
<script src="captions.js"></script>
<script>
const A = window.TRIP_ALBUM, G = window.TRIP_CAPTION_GROUPS, list = document.getElementById('list');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rng = r => r.map(([a, b]) => a === b ? `${a + 1}` : `${a + 1}–${b + 1}`).join(', ');
list.innerHTML = G.map((g, k) => {
  const first = g.r[0][0], idxs = [first, Math.min(first + 1, g.r[0][1]), g.r[0][1]].filter((v, i, a) => a.indexOf(v) === i);
  return `<div class="grp"><div class="imgs">${idxs.map(i => `<img loading="lazy" alt="" src="${A.urls[i]}=w200-h200-c" onerror="this.style.visibility='hidden'">`).join('')}</div><div class="c"><div class="t">תמונות ${rng(g.r)} · ${A.times[first]}</div><h2>${esc(g.n)}</h2><p>${esc(g.t)}</p></div><button data-k="${k}">העתק</button></div>`;
}).join('');
const copy = async (text, btn, label) => {
  try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }
  btn.textContent = 'הועתק ✓'; setTimeout(() => { btn.textContent = label; }, 1200);
};
list.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) copy(G[+b.dataset.k].t, b, 'העתק'); });
document.getElementById('all').addEventListener('click', e => copy(G.map(g => `${g.n} (תמונות ${rng(g.r)})\n${g.t}`).join('\n\n'), e.target, 'העתק הכל'));
</script>
</body>
</html>
